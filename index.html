<!DOCTYPE html><html lang="en"><head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mobile Preview &amp; Editor Pro</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/dracula.min.css" />
  
<link rel="stylesheet" href="style.css" /></head>
<body>
  <header>
    <h1>📱 Mobile Editor Pro</h1>
    <input type="text" id="url-input" class="url-input" placeholder="Paste external URL (edit disabled due to CORS)" />
    <button id="load-url" class="btn btn-secondary">Load URL</button>
    <input type="file" id="file-import" multiple="" accept=".html,.htm,.css,.js" style="display:none" />
    <button id="import-btn" class="btn btn-secondary">📂 Import Files</button>
    <button id="export-btn" class="btn">📦 Export ZIP</button>
  </header>

  <div class="main">
    <div class="code-panel">
      <div class="tabs">
        <div class="tab active" data-tab="html">index.html</div>
        <div class="tab" data-tab="css">style.css</div>
        <div class="tab" data-tab="js">script.js</div>
      </div>
      <div class="toolbar">
        <button class="tool-btn" id="undo-btn">↩️ Undo</button>
        <button class="tool-btn" id="redo-btn">↪️ Redo</button>
        <button class="tool-btn" id="find-btn">🔍 Find</button>
        <button class="tool-btn" id="inspect-btn">🖥️ Inspect</button>
        <button class="tool-btn" id="console-btn">📟 Console</button>
      </div>
      <div id="search-bar" class="search-bar">
        <input type="text" id="search-input" placeholder="Search..." />
        <span id="search-count">0/0</span>
        <button id="search-prev">⬆️</button>
        <button id="search-next">⬇️</button>
        <button id="search-close">✖</button>
      </div>
      <div class="editor-container">
        <textarea id="html-editor"></textarea>
        <textarea id="css-editor" style="display:none"></textarea>
        <textarea id="js-editor" style="display:none"></textarea>
      </div>
    </div>

    <div class="preview-panel">
      <div class="toolbar-bottom">
        <select id="device-select">
          <option value="mobile">📱 Mobile</option>
          <option value="tablet">📟 Tablet</option>
          <option value="desktop">🖥️ Desktop</option>
        </select>
        <label>Font: <input type="range" id="font-scale" min="0.5" max="2" step="0.1" value="1" /></label>
        <label>Images: <input type="range" id="img-scale" min="0.5" max="2" step="0.1" value="1" /></label>
      </div>
      <div id="frame" class="frame-wrapper device-mobile">
        <iframe id="preview-frame" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-modals"></iframe>
      </div>
      <p style="font-size: 0.75rem; color: #64748b; text-align: center;">Import files or paste code to get started. Inspect/Console work with local code only.</p>
    </div>

    <!-- Console Panel -->
    <div id="console-panel" class="side-panel">
      <div class="panel-header"><span>📟 Console Output</span> <button class="panel-btn" id="clear-console">🗑️</button> <button class="panel-btn close-panel">✖</button></div>
      <div id="console-content" class="panel-content"></div>
    </div>

    <!-- Inspect Panel -->
    <div id="inspect-panel" class="side-panel">
      <div class="panel-header"><span>🖥️ DOM Inspector</span> <button class="panel-btn" id="refresh-inspect">🔄</button> <button class="panel-btn close-panel">✖</button></div>
      <div id="inspect-content" class="panel-content"></div>
    </div>
  </div>

  <div id="toast" class="toast">✅ Operation successful</div>

  
  
  
  
  
  
  

  

<script src="script.js"></script></body></html>
